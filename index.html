<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pick the Transformation — CSC360 Mini Exercise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#141414; --bg-elev:#1c1c1c; --ink:#efece4; --ink-dim:#a8a6a0;
    --line:#3a3937; --accent:#e2542b; --ok:#7fae6b; --bad:#c85c4a; --radius:3px;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Archivo',system-ui,-apple-system,sans-serif; -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace;}
  .wrap{max-width:780px; margin:0 auto; padding:24px 20px 48px;}
  header{padding:6px 0 20px; border-bottom:1px solid var(--line); margin-bottom:22px;}
  .tag{font-size:.78rem; color:var(--ink-dim); letter-spacing:.02em;}
  .tag b{color:var(--accent);}
  h1{font-size:clamp(1.5rem,4vw,2rem); margin:8px 0 0; letter-spacing:-.01em;}

  .card{background:var(--bg-elev); border:1px solid var(--line); padding:18px 20px; margin-bottom:18px;}
  .q-label{font-family:'JetBrains Mono',monospace; font-size:.72rem; color:var(--accent); margin-bottom:8px;}
  .q-text{font-size:1.02rem; line-height:1.5; margin:0;}

  .opts{display:grid; gap:8px; margin-top:16px;}
  .opt{
    display:flex; align-items:center; gap:10px; border:1px solid var(--line); background:var(--bg);
    padding:10px 14px; border-radius:var(--radius); cursor:pointer; font-size:.9rem;
  }
  .opt:hover{border-color:var(--accent);}
  .opt.picked{border-color:var(--accent); background:rgba(226,84,43,.1);}
  .opt input{accent-color:var(--accent);}

  .upload-row{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:16px;}
  .tiny-btn, label.tiny-btn{
    font-family:'JetBrains Mono',monospace; font-size:.75rem; padding:9px 14px; border:1px solid var(--line);
    background:transparent; color:var(--ink); cursor:pointer; border-radius:var(--radius);
  }
  .tiny-btn:hover{border-color:var(--accent);}
  #fileInput{ position:absolute; width:1px; height:1px; overflow:hidden; opacity:0; }

  .canvases{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:18px;}
  @media (max-width:540px){ .canvases{grid-template-columns:1fr;} }
  .cnv-card h4{margin:0 0 8px; font-size:.7rem; color:var(--ink-dim); font-family:'JetBrains Mono',monospace; font-weight:500;}
  canvas{width:100%; display:block; background:#0d0d0d; image-rendering:pixelated; border:1px solid #000;}

  .btn-primary{
    font-family:'JetBrains Mono',monospace; font-weight:600; font-size:.85rem; padding:12px 22px;
    background:var(--accent); border:1px solid var(--accent); color:#fff; border-radius:var(--radius);
    cursor:pointer; margin-top:18px;
  }
  .btn-primary:disabled{opacity:.4; cursor:not-allowed;}

  .feedback{margin-top:16px; padding:14px 16px; border-radius:var(--radius); font-size:.9rem; line-height:1.5; display:none;}
  .feedback.show{display:block;}
  .feedback.correct{background:rgba(127,174,107,.12); border:1px solid var(--ok); color:var(--ink);}
  .feedback.incorrect{background:rgba(200,92,74,.12); border:1px solid var(--bad); color:var(--ink);}
  footer{text-align:center; color:var(--ink-dim); font-size:.75rem; margin-top:10px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="tag"><b>CSC360</b> · Image Processing — Mini Exercise</div>
    <h1>Pick the Transformation</h1>
  </header>

  <div class="card">
    <div class="q-label">IMAGE STATE</div>
    <select id="stateSelect" class="mono" style="width:100%; background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:var(--radius); padding:10px 12px; font-size:.85rem; margin-bottom:12px;"></select>
    <p class="q-text" id="qText"></p>

    <div class="q-label" style="margin-top:18px;">PICK THE MATCHING TYPE</div>
    <div class="opts" id="optsBox"></div>

    <div class="upload-row">
      <label class="tiny-btn" for="fileInput">upload your image</label>
      <input type="file" id="fileInput" accept="image/*">
      <span class="mono" id="fileName" style="font-size:.75rem; color:var(--ink-dim);">no image chosen</span>
    </div>

    <div class="canvases">
      <div class="cnv-card"><h4>original</h4><canvas id="srcCanvas" width="260" height="260"></canvas></div>
      <div class="cnv-card"><h4>your result</h4><canvas id="outCanvas" width="260" height="260"></canvas></div>
    </div>

    <button class="btn-primary" id="applyBtn" disabled>Apply &amp; check my answer</button>
    <div class="feedback" id="feedback"></div>
  </div>

  <footer>Prepared by Eng. Menna Medhat · CSC360 Image Processing</footer>
</div>

<script>
(function(){
  const TYPES = ["Negative transformation","Log transformation","Power-law (gamma) transformation","Gray-level slicing","Brightness thresholding","Contrast stretching"];

  const TRANSFORMS = {
    "Negative transformation": r => 255 - r,
    "Log transformation": r => (255/Math.log(256)) * Math.log(1+r),
    "Power-law (gamma) transformation": r => 255 * Math.pow(r/255, 0.4),
    "Gray-level slicing": r => (r>=100 && r<=180) ? 255 : r,
    "Brightness thresholding": r => r < 128 ? 0 : 255,
    "Contrast stretching": r => {
      let mn=255,mx=0;
      for(const v of srcGray){ if(v<mn) mn=v; if(v>mx) mx=v; }
      if(mx===mn) return r;
      return (r-mn)/(mx-mn) * 255;
    }
  };

  const STATES = [
    { name:"State A — flat, hazy, low contrast", text:"The whole image looks washed out: pixel values are bunched into a narrow gray band and nothing looks truly black or white.", correct:"Contrast stretching", explain:"Contrast stretching rescales the narrow input range to fill the full 0–255 range — the classic fix for a flat, low-contrast image." },
    { name:"State B — shadow detail hidden", text:"Shadows are almost pure black and hide detail, while the bright areas are already fine and shouldn't be pushed further.", correct:"Log transformation", explain:"Log transformation expands dark values and compresses bright ones automatically, revealing shadow detail without blowing out highlights." },
    { name:"State C — needs an adjustable overall brighten/darken", text:"The image needs an overall, tunable brightness correction — the amount of correction should be adjustable via a single exponent.", correct:"Power-law (gamma) transformation", explain:"Power-law / gamma correction (s = c·r^γ) lets you dial brightness up or down by changing a single exponent γ." },
    { name:"State D — only one gray band matters", text:"You only care about highlighting pixels that fall in one specific brightness band (e.g. a tumor or a defect), leaving everything else as-is or suppressed.", correct:"Gray-level slicing", explain:"Gray-level slicing isolates a chosen intensity band [A,B], the rest is suppressed or preserved." },
    { name:"State E — need strict black-or-white split", text:"You need a hard, binary split — every pixel becomes either pure black or pure white for object/background separation.", correct:"Brightness thresholding", explain:"Thresholding is the binary special case of slicing: r < T → 0, else → 255." },
    { name:"State F — want an inverted / film-negative look", text:"You want the classic inverted look used to read faint detail on X-ray film.", correct:"Negative transformation", explain:"Negative transformation (s = 255 − r) flips the intensity range, which is exactly the film-negative effect." }
  ];

  let stateIdx = 0, picked = null, srcGray = null; const W=260,H=260;

  const stateSelect = document.getElementById('stateSelect');
  STATES.forEach((s,i)=>{
    const o = document.createElement('option'); o.value=i; o.textContent=s.name; stateSelect.appendChild(o);
  });
  stateSelect.addEventListener('change', ()=>{ stateIdx = parseInt(stateSelect.value,10); loadState(); });

  const optsBox = document.getElementById('optsBox');
  TYPES.forEach(label=>{
    const row = document.createElement('label');
    row.className = 'opt';
    row.innerHTML = `<input type="radio" name="opt" value="${label}"><span>${label}</span>`;
    row.addEventListener('click', ()=>{
      picked = label;
      document.querySelectorAll('.opt').forEach(o=>o.classList.remove('picked'));
      row.classList.add('picked');
      checkReady();
    });
    optsBox.appendChild(row);
  });

  function loadState(){
    document.getElementById('qText').textContent = STATES[stateIdx].text;
    picked = null;
    document.querySelectorAll('.opt').forEach(o=>{ o.classList.remove('picked'); o.querySelector('input').checked=false; });
    document.getElementById('feedback').classList.remove('show');
    document.getElementById('outCanvas').getContext('2d').clearRect(0,0,W,H);
    checkReady();
  }

  function checkReady(){
    document.getElementById('applyBtn').disabled = !(picked!==null && srcGray);
  }

  function toGray(imgData){
    const d = imgData.data, g = new Uint8ClampedArray(imgData.width*imgData.height);
    for(let i=0,j=0;i<d.length;i+=4,j++) g[j] = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
    return g;
  }
  function draw(canvas, gray){
    const ctx = canvas.getContext('2d');
    const id = ctx.createImageData(W,H);
    for(let i=0,j=0;i<id.data.length;i+=4,j++){
      id.data[i]=id.data[i+1]=id.data[i+2]=gray[j]; id.data[i+3]=255;
    }
    ctx.putImageData(id,0,0);
  }

  document.getElementById('fileInput').addEventListener('change', (e)=>{
    const file = e.target.files[0]; if(!file) return;
    document.getElementById('fileName').textContent = file.name;
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = ()=>{
      const c = document.createElement('canvas'); c.width=W; c.height=H;
      const ctx = c.getContext('2d');
      const scale = Math.max(W/img.width, H/img.height);
      const dw = img.width*scale, dh = img.height*scale;
      ctx.drawImage(img, (W-dw)/2, (H-dh)/2, dw, dh);
      srcGray = toGray(ctx.getImageData(0,0,W,H));
      draw(document.getElementById('srcCanvas'), srcGray);
      document.getElementById('feedback').classList.remove('show');
      checkReady();
      URL.revokeObjectURL(url);
    };
    img.src = url;
  });

  document.getElementById('applyBtn').addEventListener('click', ()=>{
    const fn = TRANSFORMS[picked];
    const out = new Uint8ClampedArray(srcGray.length);
    for(let i=0;i<srcGray.length;i++) out[i] = Math.round(Math.max(0,Math.min(255, fn(srcGray[i]))));
    draw(document.getElementById('outCanvas'), out);

    const state = STATES[stateIdx];
    const fb = document.getElementById('feedback');
    fb.classList.add('show');
    if(picked === state.correct){
      fb.className = 'feedback show correct';
      fb.textContent = '✓ Correct — ' + state.explain;
    } else {
      fb.className = 'feedback show incorrect';
      fb.textContent = '✗ Not quite — you picked "' + picked + '", but the matching type for this state is "' + state.correct + '". ' + state.explain;
    }
  });

  loadState();
})();
</script>
</body>
</html>
